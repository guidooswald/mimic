<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" style="background:#0a0f1d;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="gradInput" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gradSys1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradPolicy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gradDirect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gradTriage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gradFlash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gradArgon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.5">MIMIC — DUAL-PROCESS AI COGNITIVE ARCHITECTURE</text>
  <text x="550" y="58" text-anchor="middle" font-size="12" fill="#94a3b8">Inspired by Daniel Kahneman's Thinking, Fast and Slow • System 1 (TypeSafe Jev) → System 2 (Gemini / Claude / DeepSeek)</text>

  <!-- Connection Lines with Arrows -->
  <path d="M 230 145 L 272 145" stroke="#818cf8" stroke-width="2.5" fill="none" marker-end="url(#arrowIndigo)"/>
  <path d="M 630 145 L 682 145" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrowEmerald)"/>
  <path d="M 830 120 L 882 102" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrowEmerald)"/>
  <path d="M 830 145 L 882 165" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M 760 190 L 760 242" stroke="#818cf8" stroke-width="2.5" fill="none" marker-end="url(#arrowIndigo)"/>

  <!-- 1. User Input Box -->
  <g filter="url(#shadow)">
    <rect x="40" y="95" width="190" height="100" rx="14" fill="url(#gradInput)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="135" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">👤 USER QUERY</text>
    <text x="135" y="145" text-anchor="middle" font-size="11" fill="#c7d2fe">Prompt + Context State</text>
    <rect x="58" y="158" width="154" height="22" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
    <text x="135" y="173" text-anchor="middle" font-size="10" font-family="monospace" fill="#a5b4fc">streaming input</text>
  </g>

  <!-- 2. System 1 (Jev) Container -->
  <g filter="url(#shadow)">
    <rect x="280" y="80" width="350" height="130" rx="16" fill="#042f2e" stroke="#10b981" stroke-width="2"/>
    <rect x="280" y="80" width="350" height="32" rx="16" fill="url(#gradSys1)"/>
    <text x="455" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">⚡ SYSTEM 1: TYPESAFE JEV (70–250ms • NOUL/SCORE/CHOICE)</text>

    <!-- Primitive 1: noul -->
    <rect x="295" y="122" width="98" height="74" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="344" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#34d399">noul</text>
    <text x="344" y="155" text-anchor="middle" font-size="9" fill="#a7f3d0">Is answer ready?</text>
    <text x="344" y="172" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#ffffff">0.00 – 1.00</text>
    <text x="344" y="187" text-anchor="middle" font-size="8" fill="#6ee7b7">≥ 0.65 resolves</text>

    <!-- Primitive 2: score -->
    <rect x="403" y="122" width="104" height="74" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
    <text x="455" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8">score</text>
    <text x="455" y="155" text-anchor="middle" font-size="9" fill="#bae6fd">Cognitive Load</text>
    <text x="455" y="172" text-anchor="middle" font-size="11" font-weight="700" font-family="monospace" fill="#ffffff">Level 0 – 3</text>
    <text x="455" y="187" text-anchor="middle" font-size="8" fill="#7dd3fc">calibrated rubric</text>

    <!-- Primitive 3: choice -->
    <rect x="517" y="122" width="100" height="74" rx="8" fill="#3b0764" stroke="#7c3aed" stroke-width="1"/>
    <text x="567" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#c084fc">choice</text>
    <text x="567" y="155" text-anchor="middle" font-size="9" fill="#e9d5ff">Target Route</text>
    <text x="567" y="172" text-anchor="middle" font-size="10" font-weight="700" font-family="monospace" fill="#ffffff">Prob. Matrix</text>
    <text x="567" y="187" text-anchor="middle" font-size="8" fill="#d8b4fe">conf. weighted</text>
  </g>

  <!-- 3. Policy Engine -->
  <g filter="url(#shadow)">
    <rect x="690" y="95" width="140" height="95" rx="14" fill="url(#gradPolicy)" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="760" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">⚖️ DUAL POLICY</text>
    <text x="760" y="142" text-anchor="middle" font-size="10" fill="#c7d2fe">Threshold Check</text>
    <text x="760" y="158" text-anchor="middle" font-size="9" fill="#e0e7ff">&amp; Mode Dispatch</text>
    <text x="760" y="176" text-anchor="middle" font-size="9" font-weight="600" fill="#86efac">Deterministic</text>
  </g>

  <!-- 4. Direct Resolution Card (Top Right) -->
  <g filter="url(#shadow)">
    <rect x="890" y="75" width="180" height="55" rx="10" fill="url(#gradDirect)" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="980" y="97" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">🚀 Direct System 1</text>
    <text x="980" y="114" text-anchor="middle" font-size="9" fill="#d1fae5">Zero LLM cost • Sub-250ms</text>
  </g>

  <!-- 5. Triage Only Card (Middle Right) -->
  <g filter="url(#shadow)">
    <rect x="890" y="140" width="180" height="55" rx="10" fill="url(#gradTriage)" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="980" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">📋 Triage Only Report</text>
    <text x="980" y="179" text-anchor="middle" font-size="9" fill="#fef3c7">System 2 paused • Metrics shown</text>
  </g>

  <!-- 6. System 2 Deliberation Cluster (Bottom) -->
  <g filter="url(#shadow)">
    <rect x="40" y="250" width="1030" height="270" rx="18" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <rect x="40" y="250" width="1030" height="36" rx="18" fill="#1e1b4b"/>
    <text x="550" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">🔬 SYSTEM 2: DELIBERATIVE REASONING &amp; GENERATION (INVOKED WHEN SCORE ≥ LEVEL 2)</text>

    <!-- Sub-cluster A: Fast Deliberation Tier -->
    <rect x="65" y="305" width="445" height="195" rx="14" fill="#082f49" stroke="#0284c7" stroke-width="1.5"/>
    <text x="287" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#38bdf8">⚡ TIER A: FAST DELIBERATION (MODERATE LOAD / LEVEL 2)</text>
    <text x="287" y="347" text-anchor="middle" font-size="10" fill="#bae6fd">Standard coding, UI components, drafting, and structured summarization</text>

    <!-- Model A1: Gemini Flash -->
    <rect x="85" y="365" width="405" height="55" rx="10" fill="url(#gradFlash)" stroke="#7dd3fc" stroke-width="1"/>
    <text x="105" y="388" font-size="12" font-weight="700" fill="#ffffff">Gemini 3.8 Flash</text>
    <text x="105" y="406" font-size="9.5" fill="#e0f2fe">google/gemini-3.8-flash • Fast multi-modal synthesis &amp; reasoning</text>
    <rect x="405" y="377" width="70" height="20" rx="6" fill="#0369a1"/>
    <text x="440" y="391" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">Default</text>

    <!-- Model A2: DeepSeek V4.1 Flash -->
    <rect x="85" y="430" width="405" height="55" rx="10" fill="url(#gradFlash)" stroke="#7dd3fc" stroke-width="1"/>
    <text x="105" y="453" font-size="12" font-weight="700" fill="#ffffff">DeepSeek V4.1 Flash</text>
    <text x="105" y="471" font-size="9.5" fill="#e0f2fe">deepseek/deepseek-v4.1-flash • 1M context, high throughput MoE</text>
    <rect x="405" y="442" width="70" height="20" rx="6" fill="#0284c7"/>
    <text x="440" y="456" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">Low-Cost</text>

    <!-- Sub-cluster B: Deep Deliberation Tier -->
    <rect x="545" y="305" width="505" height="195" rx="14" fill="#2e1065" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="797" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#c084fc">💎 TIER B: DEEP SLOW THINKING (HIGH LOAD / LEVEL 3)</text>
    <text x="797" y="347" text-anchor="middle" font-size="10" fill="#e9d5ff">Distributed systems, formal math proofs, hard debugging &amp; architecture</text>

    <!-- Model B1: Gemini 4 Argon -->
    <rect x="565" y="365" width="230" height="55" rx="10" fill="url(#gradArgon)" stroke="#c084fc" stroke-width="1"/>
    <text x="580" y="388" font-size="12" font-weight="700" fill="#ffffff">Gemini 4 Argon</text>
    <text x="580" y="406" font-size="9" fill="#f3e8ff">Argon frontier architecture</text>
    <rect x="725" y="375" width="60" height="18" rx="5" fill="#581c87"/>
    <text x="755" y="388" text-anchor="middle" font-size="8.5" font-weight="600" fill="#ffffff">Frontier</text>

    <!-- Model B2: Claude Sonnet 5.5 -->
    <rect x="805" y="365" width="225" height="55" rx="10" fill="url(#gradArgon)" stroke="#c084fc" stroke-width="1"/>
    <text x="820" y="388" font-size="12" font-weight="700" fill="#ffffff">Claude Sonnet 5.5</text>
    <text x="820" y="406" font-size="9" fill="#f3e8ff">Full-stack code &amp; UI nuance</text>
    <rect x="960" y="375" width="60" height="18" rx="5" fill="#581c87"/>
    <text x="990" y="388" text-anchor="middle" font-size="8.5" font-weight="600" fill="#ffffff">Code Pro</text>

    <!-- Model B3: DeepSeek R1 -->
    <rect x="565" y="430" width="230" height="55" rx="10" fill="url(#gradArgon)" stroke="#c084fc" stroke-width="1"/>
    <text x="580" y="453" font-size="12" font-weight="700" fill="#ffffff">DeepSeek R1 (0528)</text>
    <text x="580" y="471" font-size="9" fill="#f3e8ff">Chain-of-thought proofs</text>
    <rect x="725" y="440" width="60" height="18" rx="5" fill="#581c87"/>
    <text x="755" y="453" text-anchor="middle" font-size="8.5" font-weight="600" fill="#ffffff">Reasoning</text>

    <!-- Model B4: OpenAI o3 Pro -->
    <rect x="805" y="430" width="225" height="55" rx="10" fill="url(#gradArgon)" stroke="#c084fc" stroke-width="1"/>
    <text x="820" y="453" font-size="12" font-weight="700" fill="#ffffff">OpenAI o3 Pro</text>
    <text x="820" y="471" font-size="9" fill="#f3e8ff">Max theorem verification</text>
    <rect x="960" y="440" width="60" height="18" rx="5" fill="#581c87"/>
    <text x="990" y="453" text-anchor="middle" font-size="8.5" font-weight="600" fill="#ffffff">Extreme</text>
  </g>
</svg>
